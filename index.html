                <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
                    <div class="modal" style="max-width:680px;">
                        <h3>${isEdit ? '✎ 编辑任务包' : '📦 创建任务包'}</h3>
                        <div class="form-group">
                            <label>任务包名称</label>
                            <input type="text" id="pkgName" value="${isEdit ? escapeHtml(pkg.name) : ''}" placeholder="如: 光缆线路施工包">
                        </div>
                        <div class="form-group">
                            <label>描述</label>
                            <input type="text" id="pkgDesc" value="${isEdit ? escapeHtml(pkg.description || '') : ''}" placeholder="简短描述此任务包的用途">
                        </div>
                        <div class="form-group">
                            <label>图标 (emoji)</label>
                            <input type="text" id="pkgIcon" value="${isEdit ? escapeHtml(pkg.icon || '📦') : '📦'}" placeholder="如: 🚧">
                        </div>
                        <div style="font-size:13px;font-weight:600;color:var(--text-light);margin:12px 0 8px;">流程步骤</div>
                        <div id="pkgStepsContainer">
                            ${steps.map((step, i) => `
                                <div class="modal-step-item" data-step-idx="${i}">
                                    <div class="step-item-header">
                                        <span style="font-size:12px;font-weight:700;color:var(--text-light);">${i+1}.</span>
                                        <input type="text" class="pkg-step-name" value="${escapeHtml(step.name)}" placeholder="步骤名称">
                                        <label style="font-size:11px;color:var(--text-light);">默认限时:</label>
                                        <input type="number" class="pkg-step-time" value="${step.defaultTimeLimit || 7}" min="0.1" step="0.1" style="width:60px;">
                                        <select class="pkg-step-unit">
                                            <option value="天" ${step.defaultUnit === '天' ? 'selected' : ''}>天</option>
                                            <option value="周" ${step.defaultUnit === '周' ? 'selected' : ''}>周</option>
                                            <option value="月" ${step.defaultUnit === '月' ? 'selected' : ''}>月</option>
                                        </select>
                                        <button class="btn btn-danger btn-xs" onclick="removePkgStep(this)">✕</button>
                                    </div>
                                    <div style="font-size:11px;color:var(--text-light);margin-bottom:4px;">需要补充的关键信息:</div>
                                    <div class="step-item-fields" data-fields-container>
                                        ${(step.requiredFields || []).map(f => `
                                            <span class="field-tag">
                                                ${escapeHtml(f)}
                                                <button class="remove-field" onclick="removePkgField(this)">✕</button>
                                            </span>
                                        `).join('')}
                                        <input type="text" class="pkg-new-field-input" placeholder="添加字段名..." 
                                               onkeydown="if(event.key==='Enter'){addPkgField(this);event.preventDefault();}"
                                               style="min-width:120px;flex:0 0 auto;">
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <button class="btn btn-outline btn-sm" onclick="addPkgStep()" style="margin-top:8px;">+ 添加步骤</button>
                        <div class="modal-actions">
                            <button class="btn btn-outline" onclick="closeModal()">取消</button>
                            <button class="btn btn-primary" onclick="${isEdit ? `saveEditPackage('${pkg.id}')` : 'saveCreatePackage()'}">
                                ${isEdit ? '✓ 保存修改' : '✓ 创建任务包'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function addPkgStep() {
            const container = document.getElementById('pkgStepsContainer');
            const idx = container.children.length;
            const div = document.createElement('div');
            div.className = 'modal-step-item';
            div.dataset.stepIdx = idx;
            div.innerHTML = `
                <div class="step-item-header">
                    <span style="font-size:12px;font-weight:700;color:var(--text-light);">${idx+1}.</span>
                    <input type="text" class="pkg-step-name" value="新步骤" placeholder="步骤名称">
                    <label style="font-size:11px;color:var(--text-light);">默认限时:</label>
                    <input type="number" class="pkg-step-time" value="7" min="0.1" step="0.1" style="width:60px;">
                    <select class="pkg-step-unit">
                        <option value="天" selected>天</option>
                        <option value="周">周</option>
                        <option value="月">月</option>
                    </select>
                    <button class="btn btn-danger btn-xs" onclick="removePkgStep(this)">✕</button>
                </div>
                <div style="font-size:11px;color:var(--text-light);margin-bottom:4px;">需要补充的关键信息:</div>
                <div class="step-item-fields" data-fields-container>
                    <input type="text" class="pkg-new-field-input" placeholder="添加字段名..." 
                           onkeydown="if(event.key==='Enter'){addPkgField(this);event.preventDefault();}"
                           style="min-width:120px;flex:0 0 auto;">
                </div>
            `;
            container.appendChild(div);
        }

        function removePkgStep(btn) {
            const item = btn.closest('.modal-step-item');
            item.remove();
            document.querySelectorAll('.modal-step-item').forEach((el, i) => {
                el.dataset.stepIdx = i;
                const numSpan = el.querySelector('.step-item-header span');
                if (numSpan) numSpan.textContent = i + 1 + '.';
            });
        }

        function addPkgField(input) {
            const value = input.value.trim();
            if (!value) return;
            const container = input.closest('[data-fields-container]');
            const tag = document.createElement('span');
            tag.className = 'field-tag';
            tag.innerHTML = `${escapeHtml(value)} <button class="remove-field" onclick="removePkgField(this)">✕</button>`;
            container.insertBefore(tag, input);
            input.value = '';
            input.focus();
        }

        function removePkgField(btn) {
            btn.closest('.field-tag').remove();
        }

        function collectPackageDataFromModal() {
            const name = document.getElementById('pkgName').value.trim();
            const desc = document.getElementById('pkgDesc').value.trim();
            const icon = document.getElementById('pkgIcon').value.trim() || '📦';
            if (!name) {
                showToast('请输入任务包名称', 'error');
                return null;
            }
            const steps = [];
            document.querySelectorAll('.modal-step-item').forEach((item, i) => {
                const stepName = item.querySelector('.pkg-step-name').value.trim() || ('步骤' + (i + 1));
                const stepTime = parseFloat(item.querySelector('.pkg-step-time').value) || 7;
                const stepUnit = item.querySelector('.pkg-step-unit').value;
                const fields = [];
                item.querySelectorAll('.field-tag').forEach(tag => {
                    const text = tag.textContent.replace('✕', '').trim();
                    if (text) fields.push(text);
                });
                steps.push({
                    id: 'step_' + Date.now() + '_' + i,
                    name: stepName,
                    requiredFields: fields,
                    defaultTimeLimit: Math.max(0.1, stepTime),
                    defaultUnit: stepUnit,
                });
            });
            if (!steps.length) {
                showToast('请至少添加一个步骤', 'error');
                return null;
            }
            return { name, description: desc, icon, steps };
        }

        function saveCreatePackage() {
            const pkgData = collectPackageDataFromModal();
            if (!pkgData) return;
            const pkg = {
                id: generateId('pkg'),
                ...pkgData,
            };
            data.packages.push(pkg);
            selectedPackageId = pkg.id;
            selectedTaskId = null;
            persist();
            closeModal();
            showToast(`✅ 任务包「${pkg.name}」创建成功！`);
        }

        function saveEditPackage(pkgId) {
            const pkgData = collectPackageDataFromModal();
            if (!pkgData) return;
            const pkg = data.packages.find(p => p.id === pkgId);
            if (!pkg) return;
            pkg.name = pkgData.name;
            pkg.description = pkgData.description;
            pkg.icon = pkgData.icon;
            pkg.steps = pkgData.steps;
            data.tasks.forEach(task => {
                if (task.packageId === pkgId) {
                    const newSteps = pkg.steps.map(ps => {
                        const existing = task.steps.find(s => s.packageStepId === ps.id);
                        if (existing) {
                            existing.name = ps.name;
                            existing.daysLimit = ps.defaultTimeLimit * (UNIT_TO_DAYS[ps.defaultUnit] || 1);
                            return existing;
                        } else {
                            return {
                                id: generateId('step'),
                                packageStepId: ps.id,
                                name: ps.name,
                                requiredFields: Object.fromEntries((ps.requiredFields || []).map(f => [f,
                                ''])),
                                daysLimit: ps.defaultTimeLimit * (UNIT_TO_DAYS[ps.defaultUnit] || 1),
                                elapsedDays: 0,
                                timerRunning: false,
                                status: 'pending',
                                overdueNotified: false,
                            };
                        }
                    });
                    task.steps = newSteps;
                }
            });
            persist();
            closeModal();
            showToast(`✅ 任务包「${pkg.name}」已更新`);
        }

        function closeModal() {
            document.getElementById('modalContainer').innerHTML = '';
        }

        // =============================================
        // 初始化
        // =============================================
        function init() {
            startTick();
            renderAll();
            checkOverdueNotifications();
        }

        document.addEventListener('DOMContentLoaded', init);

        window.addEventListener('beforeunload', () => {
            saveData(data);
        });

        // 暴露全局函数
        window.switchTab = switchTab;
        window.selectTask = selectTask;
        window.selectPackage = selectPackage;
        window.startTask = startTask;
        window.pauseTask = pauseTask;
        window.resumeTask = resumeTask;
        window.completeTask = completeTask;
        window.resetTask = resetTask;
        window.deleteTask = deleteTask;
        window.startStep = startStep;
        window.pauseStep = pauseStep;
        window.resumeStep = resumeStep;
        window.completeStep = completeStep;
        window.resetStep = resetStep;
        window.updateStepField = updateStepField;
        window.openCreateTaskModal = openCreateTaskModal;
        window.updateCreateTaskSteps = updateCreateTaskSteps;
        window.createTask = createTask;
        window.openCreatePackageModal = openCreatePackageModal;
        window.openEditPackageModal = openEditPackageModal;
        window.addPkgStep = addPkgStep;
        window.removePkgStep = removePkgStep;
        window.addPkgField = addPkgField;
        window.removePkgField = removePkgField;
        window.saveCreatePackage = saveCreatePackage;
        window.saveEditPackage = saveEditPackage;
        window.deletePackage = deletePackage;
        window.closeModal = closeModal;
    </script>
</body>
</html>
